services:
  db:
    image: postgres:15-alpine
    container_name: ca_rms_pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  etl:
    build: .
    container_name: ca_rms_etl
    depends_on:
      - db
    env_file:
      - .env               # inject all vars into container
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # Build the full SQLAlchemy URL inside the container (optional)
      DB_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      # To build DB_URL inside compose can also do:
      # DB_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    volumes:
      - ./data:/app/data
      - ./scripts:/app/scripts
    entrypoint: ["python"]

volumes:
  pg_data: {}